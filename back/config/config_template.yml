pastell:
  url : <url>
  # user : <utilisateur Pastell à qui appartient le token> (optionnel, indicatif)
  token : <token d'accès Pastell>

keycloak:
  token_url: <token>
  refresh_url: <refresh>
  auth_url: <auth>
  jwks_url: <jwks>
  client_id: megacte
  # audiences autorisées pour le JWT (client web + clients de synchronisation)
  valid_audiences: [megacte, megacte-sync]
  # rôle Keycloak requis pour les endpoints admin (POST /user, POST /users/refresh)
  admin_role: megacte-admin

database:
  pwd : <pwd>
  user : megacte
  host : localhost
  port : 54032
  database: megacte

s2low:
  url: <urm>
  path_certificate: <certificat .pem>
  path_key: <private_key.pem>
  key_password: <password>

sync:
  enabled: true
  interval_minutes: 1440