[project]
name = "megacte-back"
version = "0.1.0"
description = "Megacte runs over Pastell as a user-friendly tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "bcrypt~=4.2.0",
    "cryptography~=43.0.3",
    "fastapi[standard]~=0.115.5",
    "psycopg2-binary~=2.9.9",
    "pydantic-settings~=2.6.1",
    "pyjwt~=2.10.0",
    "pyyaml~=6.0.2",
    "requests~=2.32.3",
    "sqlalchemy~=2.0.34",
]

[tool.black]
line-length = 120
target-version = ['py311']
include = '\.py$'
exclude = '''
^/(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.github          # root of the project
    | \.mypy_cache
    | \.tox
    | venv
    | \.venv
    | build
    | dist
    | migrations
    | config
)
'''

[dependency-groups]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
]
