[project]
name = "megacte-back"
version = "0.3.4"
description = "Megacte backend"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic==1.20.1",
    "bcrypt>=4.2.0,<6",
    "cryptography>=49.0.0",
    "fastapi[standard]>=0.115.5,<1",
    "psycopg[binary]>=3,<4",
    "pydantic-settings>=2.6.1,<3",
    "pyjwt>=2.14.0,<3",
    "pyyaml>=6.0.2,<7",
    "requests>=2.32.3,<3",
    "sqlalchemy>=2.0.34,<3",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-cov==7.1.0",
    "ruff>=0.16.5",
]

[tool.ruff]
# Default line length is 88 (https://docs.astral.sh/ruff/configuration/)
line-length = 120
extend-exclude = [
  "migrations",
  "config"
]

[tool.ruff.lint.flake8-bugbear]
# Allow default arguments like, e.g., `data: List[str] = fastapi.Query(None)`.
extend-immutable-calls = ["fastapi.Depends", "fastapi.File"]
