[project]
name = "megacte-back"
version = "0.1.0"
description = "Megacte backend"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.14.0",
    "bcrypt~=4.2.0",
    "cryptography~=43.0.3",
    "fastapi[standard]~=0.115.5",
    "psycopg2-binary~=2.9.9",
    "pydantic-settings~=2.6.1",
    "pyjwt~=2.10.0",
    "pyyaml~=6.0.2",
    "requests~=2.32.3",
    "sqlalchemy~=2.0.34",
]

[dependency-groups]
dev = [
    "pytest==8.3.2",
    "pytest-cov==5.0.0",
    "ruff>=0.16.5",
]

[tool.ruff]
# Default line length is 88 (https://docs.astral.sh/ruff/configuration/)
line-length = 120
