name: megacte

configs:
  api-config:
    file: ./config_local_nuxt_kc_xp/api-config.yml
  private-key:
    file: ./config_local_nuxt_kc_xp/private_key.pem
  public-certificate:
    file: ./config_local_nuxt_kc_xp/publicCertificate_tech.pem

services:
  backend:
    image: megacte-backend
    build:
      context: ./back
    command: ["./docker-backend-start.sh", "--dev"]
    configs:
      - source: api-config
        target: /megacte-back/config/config.yml
      - source: private-key
        target: /megacte-back/config/private_key.pem
      - source: public-certificate
        target: /megacte-back/config/publicCertificate_tech.pem
    depends_on:
      db:
        condition: service_healthy
    environment:
      MEGACTE_LOGLEVEL: "DEBUG"
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "8080:8080"
    networks:
      - megacte-front-tier
      - megacte-back-tier
    volumes:
      - type: bind
        source: ./back/app
        target: /megacte-back/app

  frontend:
    image: nuxt-frontend
    build:
      context: ./nuxt-web-app
      dockerfile: Dockerfile.dev
    command: npm run dev -- --host 0.0.0.0
    env_file:
      - .env
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_REALM: megalis
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      API_BASE_URL: ${API_URL}
      AUTH_ORIGIN: ${AUTH_ORIGIN}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - megacte-front-tier
    volumes:
      - type: bind
        source: ./nuxt-web-app/app
        target: /nuxt-app/app
      - type: bind
        source: ./nuxt-web-app/server
        target: /nuxt-app/server
      - type: bind # Ajout du volume public
        source: ./nuxt-web-app/public
        target: /nuxt-app/public

  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - megacte-db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      megacte-back-tier:
        aliases:
          - megacte-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  megacte-db-data:

networks:
  megacte-back-tier:
  megacte-front-tier:
