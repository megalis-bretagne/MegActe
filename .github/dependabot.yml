version: 2
updates:
  # Mise à jour des dépendances Python
  - package-ecosystem: "pip"
    directory: "/back"
    target-branch: "dev"
    open-pull-requests-limit: 5
    schedule:
      interval: "weekly"
    labels:
      - "dependencies"
      - "python"
      - "backend"
      - "dependabot"

  # Mise à jour des dépendances npm
  - package-ecosystem: "npm"
    directory: "/nuxt-web-app"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "typescript"
      - "frontend"
      - "dependabot"
    groups:
      nuxt:
        patterns:
          - "nuxt"
          - "@nuxt/*"
      vue:
        patterns:
          - "vue"
          - "vue-*"
      primevue:
        patterns:
          - "primevue"
          - "@primeuix/*"
          - "primeicons"
      tailwind:
        patterns:
          - "tailwindcss"
          - "tailwindcss-*"
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

  # Mise à jour des actions GitHub
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
      - "ci"
      - "dependabot"
