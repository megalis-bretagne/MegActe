name: Main Megacte Worker

on:
  push:
    branches:
      - dev
      - nuxtjs
      - main
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  packages: write

jobs:
  build-app:
    name: Build Megacte app
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    uses: ./.github/workflows/build-megacte-app.yml
    secrets: inherit

  build-images-pr:
    name: Build Megacte images for PR
    if: github.event_name == 'pull_request'
    needs: build-app
    uses: ./.github/workflows/build-megacte-images.yml
    with:
      push-images: false
    secrets: inherit

  prepare-release:
    name: Validate version and create Git tag
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate VERSION and tag availability
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "VERSION must contain a strict SemVer value such as 0.3.1" >&2
            exit 1
          fi
          if [[ "$(wc -l < VERSION)" -gt 1 ]]; then
            echo "VERSION must contain exactly one line" >&2
            exit 1
          fi
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create and push Git tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$VERSION" -m "Release v$VERSION"
          git push origin "v$VERSION"

  build-images-main:
    name: Build and push Megacte images
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: prepare-release
    uses: ./.github/workflows/build-megacte-images.yml
    with:
      push-images: true
    secrets: inherit
