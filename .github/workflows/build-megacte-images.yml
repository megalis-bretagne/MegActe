name: Build Megacte images

on:
  workflow_call:
    inputs:
      push-images:
        description: Push images to GHCR
        required: false
        default: false
        type: boolean
      tag-prefix:
        description: Prefix for image tags
        required: false
        default: ""
        type: string
    outputs:
      version:
        description: Validated application version
        value: ${{ jobs.metadata.outputs.version }}
      image-tag:
        description: Published image tag
        value: ${{ jobs.metadata.outputs.image-tag }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAMESPACE: megalis-bretagne

jobs:
  metadata:
    name: Validate version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image-tag: ${{ steps.version.outputs.image-tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate VERSION
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '\r\n' < VERSION)"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "VERSION must contain a valid SemVer value such as 0.3.1 or 0.3.1-rc.1" >&2
            exit 1
          fi
          if [[ "$(wc -l < VERSION)" -gt 1 ]]; then
            echo "VERSION must contain exactly one line" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image-tag=${{ inputs['tag-prefix'] }}$version" >> "$GITHUB_OUTPUT"

  build-backend:
    name: Build and scan backend image
    needs: [metadata, scan-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: inputs.push-images
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./back
          file: ./back/Dockerfile-hardened
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/megacte-back:${{ needs.metadata.outputs.image-tag }}

      - name: Push backend image
        if: inputs.push-images
        uses: docker/build-push-action@v7
        with:
          context: ./back
          file: ./back/Dockerfile-hardened
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/megacte-back:${{ needs.metadata.outputs.image-tag }}

  build-frontend:
    name: Build and scan frontend image
    needs: [metadata, scan-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to GHCR
        if: inputs.push-images
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nuxt-web-app/Dockerfile-hardened
          load: true
          push: false
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/megacte-web:${{ needs.metadata.outputs.image-tag }}

      - name: Push frontend image
        if: inputs.push-images
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./nuxt-web-app/Dockerfile-hardened
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/megacte-web:${{ needs.metadata.outputs.image-tag }}

  scan-backend:
    name: Scan backend image with Trivy
    needs: metadata
    uses: ./.github/workflows/trivy.yml
    with:
      image: megacte-back
      context: ./back
      dockerfile: ./back/Dockerfile-hardened
      tag: ${{ needs.metadata.outputs.version }}
      application: back

  scan-frontend:
    name: Scan frontend image with Trivy
    needs: metadata
    uses: ./.github/workflows/trivy.yml
    with:
      image: megacte-web
      context: .
      dockerfile: ./nuxt-web-app/Dockerfile-hardened
      tag: ${{ needs.metadata.outputs.version }}
      application: front
