name: megacte

configs:
  api-config:
    file: ./config/api-config.yml
  private-key:
    file: ./config/MegActe_Provisioning_S2LOW_private_key.pem
  public-certificate:
    file: ./config/MegActe_Provisioning_Administrateur_S2LOW.pem

services:
  backend:
    image: megacte-backend
    build:
      context: ./back
    command: ["./docker-backend-start.sh", "--dev"]
    configs:
      - source: api-config
        target: /megacte-back/config/config.yml
      - source: private-key
        target: /megacte-back/config/MegActe_Provisioning_S2LOW_private_key.pem
      - source: public-certificate
        target: /megacte-back/config/MegActe_Provisioning_Administrateur_S2LOW.pem
    depends_on:
      db:
        condition: service_healthy
    environment:
      MEGACTE_LOGLEVEL: "DEBUG"
    ports:
      - "8080:8080"
    networks:
      - megacte-front-tier
      - megacte-back-tier

  frontend:
    image: megacte-frontend
    build:
      context: .
      dockerfile: nuxt-web-app/Dockerfile
    environment:
      KEYCLOAK_ISSUER: ${KEYCLOAK_ISSUER}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID}
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
      NUXT_PUBLIC_API_BASE_URL: ${NUXT_PUBLIC_API_BASE_URL}
      NUXT_API_BASE_URL: ${NUXT_API_BASE_URL}
      AUTH_ORIGIN: http://localhost:3000/auth
      NUXT_AUTH_SECRET: ${NUXT_AUTH_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - megacte-front-tier

  db:
    image: postgres:18.3-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - megacte-db-data:/var/lib/postgresql
    ports:
      - "5432:5432"
    networks:
      megacte-back-tier:
        aliases:
          - megacte-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  megacte-db-data:

networks:
  megacte-back-tier:
  megacte-front-tier:
